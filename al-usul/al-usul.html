<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أصول القراءات - مصاحف مكتوبة</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="al-usul.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- الشريط العلوي -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <h1>📚 أصول روايات القرآن الكريم</h1>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="../index.html">🏠 الرئيسية</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content" style="min-height: 100vh;">
        <div class="page-container">

            <!-- القسم العلوي: قائمة الأبواب + الجدول -->
            <div class="content-wrapper">

                <!-- قائمة الأبواب -->
                <aside class="bab-list" id="babList">
                    <!-- القائمة المنسدلة (تظهر في الهواتف) -->
                    <div class="bab-dropdown-wrapper">
                        <button class="bab-dropdown-btn" id="babDropdownBtn" onclick="toggleBabDropdown()">
                            📚 <span id="selectedBabName">اختر باباً</span> <span style="margin-right:auto;">▼</span>
                        </button>
                        <div class="bab-dropdown-content" id="babDropdownContent">
                            <!-- سيتم إنشاؤها بواسطة JavaScript -->
                        </div>
                    </div>
                    <!-- القائمة الجانبية (تظهر في الحواسيب) -->
                    <div class="bab-sidebar" id="babSidebar">
                        <!-- سيتم إنشاؤها بواسطة JavaScript -->
                    </div>
                </aside>

                <!-- الجدول + الملاحظات والاستثناءات -->
                <section class="table-section">
                    <!-- قائمة الرواة -->
                    <div class="rawi-list-wrapper" id="rawiListWrapper">
                        <!-- سيتم إنشاؤها بواسطة JavaScript -->
                    </div>

                    <!-- الجدول -->
                    <div class="table-wrapper" id="tableWrapper">
                        <div class="empty-state">📭 اختر باباً من القائمة لعرض البيانات</div>
                    </div>

                    <!-- الملاحظات والاستثناءات (موازية للجدول) -->
                    <div class="bottom-section">
                        <!-- الملاحظات -->
                        <div id="generalNotes" class="notes-section" style="display:none;">
                            <h3>📌 ملاحظات</h3>
                            <div id="notesContainer"></div>
                        </div>

                        <!-- الاستثناءات -->
                        <div id="exceptionsSection" class="exceptions-section" style="display:none;">
                            <h3>⚠️ استثناءات</h3>
                            <div id="exceptionsContainer"></div>
                        </div>
                    </div>
                </section>

            </div>

        </div>
    </main>

    <script src="al-usul.js"></script>
</body>
</html>
