<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ جمع القراءات العشر الصغرى ✨</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="tahrirat.css">
</head>
<body>
    <div class="tahrirat-container">
        
        <!-- ===== الرأس ===== -->
        <div class="tahrirat-header">
            <h1>✨ جمع القراءات العشر من طريقي الشاطبية والدرة ✨</h1>
            <button id="backToQuran" class="back-btn"><span>🏠 العودة إلى المصحف</span></button>
        </div>

        <!-- ===== الفلاتر ===== -->
        <div class="tahrirat-controls">
            <select id="surahSelect" class="filter-select"></select>
            <select id="ayahSelect" class="filter-select">
                <option value="all">جميع الايات</option>
            </select>
            <input type="number" id="pageInput" class="filter-input" placeholder="🔍 رقم الصفحة" min="1" max="604">
            <select id="readerFilter" class="filter-select">
                <option value="all">جميع القراء</option>
            </select>
            <button id="resetFilters" class="stats-btn primary"><span>🔄 إعادة الضبط</span></button>
        </div>

        <!-- ===== الجدول (للكمبيوتر) ===== -->
        <div class="tahrirat-table-container" id="tableContainer">
            <table id="tahriratTable">
                <thead>
                    <tr>
                        <th>سورة</th>
                        <th>اية</th>
                        <th>رتبة</th>
                        <th>تحريرات جزئية لكل ءاية</th>
                        <th>بيان القراءة</th>
                        <th>يقرأ</th>
                        <th>المندرجين</th>
                        <th>صفحة</th>
                    </tr>
                </thead>
                <tbody id="tahriratBody">
                    <tr><td colspan="8" style="text-align:center; padding:30px;">⏳ جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- ===== عرض الهاتف ===== -->
        <div class="mobile-container" id="mobileContainer">
            <div id="mobileContent">
                <div class="no-data-mobile">📖 اختر سورة لعرض الآيات</div>
            </div>
        </div>

        <!-- ===== البطاقة المنبثقة ===== -->
        <div class="popup-overlay" id="popupOverlay">
            <div class="popup-card" id="popupCard">
                <div id="popupContent"></div>
            </div>
        </div>

    </div>

    <!-- ===== مشغل الصوت ===== -->
    <div class="audio-player" id="audioPlayer">
        <div class="audio-controls">
            <button id="playAudioBtn" class="audio-btn" title="تشغيل">▶️</button>
            <button id="stopAudioBtn" class="audio-btn" title="إيقاف">⏹️</button>
            <span id="audioStatus" class="audio-status">⏸️ متوقف</span>
        </div>
        <div class="audio-info">
            <span id="audioPageDisplay">📄 الصفحة: -</span>
            <span id="audioSurahDisplay">📖 السورة: -</span>
        </div>
    </div>
    <!-- ===== زر إظهار/إخفاء مشغل الصوت ===== -->
        <button id="toggleAudioPlayerBtn" class="toggle-audio-btn" title="إظهار/إخفاء مشغل الصوت">
            🎵
        </button>

    <script src="tahrirat.js"></script>
</body>
</html>
