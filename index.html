<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصاحف الأصول الملونة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- القائمة الجانبية اليسرى (القراء والرواة) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>📚 القراءات العشر مكتوبة 📚</h3>
                <button id="toggleSidebarBtn" class="toggle-btn">◀</button>
            </div>
            <div class="sidebar-content">
                <div class="mode-buttons">
                    <button id="singleModeBtn" class="mode-btn active">📖 صفحة واحدة</button>
                    <button id="doubleModeBtn" class="mode-btn">📖📖 صفحتان</button>
                    <button id="compareModeBtn" class="mode-btn">⚖️ مقارنة</button>
                </div>
                <div id="readersTree" class="readers-tree"></div>
            </div>
        </aside>

        <!-- القسم الرئيسي (المصحف) -->
        <main class="main-area">
            <div class="top-bar">
                <div class="surah-name" id="surahNameDisplay">الفاتحة</div>
                <div class="juz-number" id="juzDisplay">الجزء 1</div>
            </div>

            <div class="view-area">
                <div id="singleView" class="view active">
                    <div class="page-container" id="singlePage"></div>
                </div>
                <div id="doubleView" class="view">
                    <div class="double-container">
                        <div class="page-box" id="rightPage"></div>
                        <div class="page-box" id="leftPage"></div>
                    </div>
                </div>
                <div id="compareView" class="view">
                    <div class="compare-container">
                        <div class="compare-box">
                            <div class="compare-title" id="compareTitle1">
                                <span>📖 المصحف الأول</span>
                                <button class="select-rawi-btn" data-side="1">اختر</button>
                            </div>
                            <div class="compare-page" id="comparePage1"></div>
                        </div>
                        <div class="compare-box">
                            <div class="compare-title" id="compareTitle2">
                                <span>📖 المصحف الثاني</span>
                                <button class="select-rawi-btn" data-side="2">اختر</button>
                            </div>
                            <div class="compare-page" id="comparePage2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- شريط التحكم السفلي -->
            <!-- شريط التحكم السفلي -->
            <div class="control-bar">
                <!-- زر القائمة المنسدلة (يحتوي على جميع الأزرار) -->
                <div class="dropdown-container">
                    <button id="menuBtn" class="menu-btn" title="القائمة">☰</button>
                    <div id="dropdownMenu" class="dropdown-menu">
                        <button id="darkModeBtn" class="dropdown-item">🌙 الوضع الليلي</button>
                        <button id="fontPlusBtn" class="dropdown-item">🔍+ تكبير الخط</button>
                        <button id="fontMinusBtn" class="dropdown-item">🔍- تصغير الخط</button>
                        <button id="bookmarkBtn" class="dropdown-item">🔖 إشارة مرجعية</button>
                        <button id="searchBtn" class="dropdown-item">🔍 بحث</button>
                        <button id="savePositionBtn" class="dropdown-item">💾 حفظ آخر موضع</button>
                        <button id="resumeBtn" class="dropdown-item">▶️ استئناف القراءة</button>
                        <button id="shareBtn" class="dropdown-item">📤 مشاركة</button>
                        <a href="Reader/Reader.html" target="_blank" class="ctrl-icon" title="قارئ المصاحف والتلاوات" style="text-decoration: none; display: inline-flex; align-items: center;">📖</a>

                        <!-- زر الإحصاءات - أضفه هنا -->
                        <a href="stats/stats.html" target="_blank" class="ctrl-icon" title="إحصاءات الكلمات الملونة" style="text-decoration: none; display: inline-flex; align-items: center;">إحصاءات📊</a>
                    </div>
                </div>

                <!-- أزرار التنقل (في الوسط) -->
                <div class="page-controls">
                    <button id="prevBtn" class="ctrl-btn"> ▶ السابقة</button>
                    <div class="page-input-wrapper">
                        <input type="text" id="pageInput" class="page-input" placeholder="صفحة" value="1">
                        <span class="page-separator"></span>
                        <span class="total-pages"></span>
                    </div>
                    <button id="nextBtn" class="ctrl-btn">التالية ◀</button>
                </div>

                <!-- عنصر فارغ للتوازن (للحفاظ على التناظر) -->
                <div class="empty-space"></div>
            </div>
        </main>

        <!-- القائمة الجانبية اليمنى (السور) -->
        <div class="surah-sidebar" id="surahSidebar">
            <div class="surah-sidebar-header">
                <h3>📑 الفهرس والبحث</h3>
                <button id="toggleSurahSidebarBtn" class="toggle-btn">◀</button>
            </div>
            <div class="surah-sidebar-content">
                <!-- محرك البحث -->
                <div class="search-box">
                    <input type="text" id="sidebarSearchInput" placeholder="🔍 بحث في القرآن..." class="sidebar-search-input">
                    <div id="sidebarSearchResults" class="sidebar-search-results"></div>
                </div>
                
                <!-- فلاتر الفهرس -->
                <div class="index-filters">
                    <label><input type="checkbox" id="filterSura" checked> السور</label>
                    <label><input type="checkbox" id="filterJuza"> الأجزاء</label>
                    <label><input type="checkbox" id="filterHizb"> الأحزاب</label>
                </div>
                
                <!-- قائمة الفهرس -->
                <div id="indexList" class="index-list"></div>
            </div>
        </div>
    </div>

    <!-- زر إظهار قائمة السور (خارج الـ app) -->
    <button id="showSurahSidebarBtn" class="show-surah-btn" title="عرض قائمة السور">📖</button>

    <!-- مودال اختيار الراوي -->
    <div id="readerModal" class="modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>اختر الراوي</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modalReadersList"></div>
        </div>
    </div>
    <!-- ========== عناصر الهواتف (تظهر فقط في الشاشات الصغيرة) ========== -->
    <div class="mobile-app" style="display: none;">
        <header class="mobile-top-bar">
            <div class="surah-name" id="mobileSurahName">الفاتحة</div>
            <div class="juz-number" id="mobileJuzDisplay">الجزء 1</div>
        </header>
        <main class="mobile-quran-area">
            <div id="mobileSingleView" class="view active">
                <div class="page-container" id="mobileSinglePage"></div>
            </div>
        </main>
        <footer class="mobile-bottom-bar">
            <!-- زر القائمة اليمنى (📚) - على اليسار -->
            <button id="openRightMenuBtn" class="menu-open-btn-bottom left-bottom" title="القراء">📚</button>
            
            <!-- أزرار التنقل -->
            <button id="mobilePrevBtn" class="nav-btn">▶</button>
            <div class="page-input-wrapper">
                <input type="text" id="mobilePageInput" class="page-input" value="1">
                <span class="page-separator"></span>
                <span class="total-pages"></span>
            </div>
            <button id="mobileNextBtn" class="nav-btn">◀</button>
            
            <!-- زر القائمة اليسرى (≡) - على اليمين -->
            <button id="openLeftMenuBtn" class="menu-open-btn-bottom right-bottom" title="القائمة">≡</button>
        </footer>
    </div>

    <!-- قوائم الهواتف -->
    <div id="rightMenu" class="side-menu right-menu">
        <div class="menu-header">
            <h3>📚 القراء العشر</h3>
            <button class="close-menu" id="closeRightMenu">&times;</button>
        </div>
        <div class="menu-content">
            <div id="mobileReadersTree" class="readers-tree"></div>
        </div>
    </div>

<div id="leftMenu" class="side-menu left-menu">
    <div class="menu-header">
        <h3>📑 القائمة</h3>
        <button class="close-menu" id="closeLeftMenu">&times;</button>
    </div>
    <div class="menu-content">

        <!-- أضف أزرار وضع العرض هنا -->
        <div class="mode-buttons">
            <button id="mobileSingleModeBtn" class="mode-btn">📖 صفحة واحدة</button>
            <button id="mobileDoubleModeBtn" class="mode-btn">📖📖 صفحتان</button>
            <button id="mobileCompareModeBtn" class="mode-btn">⚖️ مقارنة</button>
        </div>
        
        <!-- مجموعة الإعدادات (مخفية وتبدو عند الضغط على السهم) -->
        <div class="settings-group">
            <div class="settings-header" id="settingsToggle">
                <span>⚙️ الإعدادات</span>
                <span class="settings-toggle">◀</span>
            </div>
            <div class="settings-list" id="settingsList">
                <button id="mobileDarkModeBtn" class="menu-item">🌙 الوضع الليلي</button>
                <button id="mobileFontPlusBtn" class="menu-item">🔍+ تكبير الخط</button>
                <button id="mobileFontMinusBtn" class="menu-item">🔍- تصغير الخط</button>
                <button id="mobileBookmarkBtn" class="menu-item">🔖 إشارة مرجعية</button>
                <button id="mobileSearchBtn" class="menu-item">🔍 بحث</button>
                <button id="mobileSavePositionBtn" class="menu-item">💾 حفظ آخر موضع</button>
                <button id="mobileResumeBtn" class="menu-item">▶️ استئناف القراءة</button>
                <button id="mobileShareBtn" class="menu-item">📤 مشاركة</button>
                <a href="Reader/Reader.html" target="_blank" class="ctrl-icon" title="قارئ المصاحف والتلاوات" style="text-decoration: none; display: inline-flex; align-items: center;">📖</a>
                <a href="stats/stats.html" target="_blank" class="menu-item" style="text-decoration: none; display: block;">📊 إحصاءات</a>
            </div>
        </div>
        
        <!-- البحث -->
        <div class="mobile-search-box">
            <input type="text" id="mobileSearchInput" placeholder="🔍 بحث في القرآن..." class="mobile-search-input">
            <div id="mobileSearchResults" class="mobile-search-results"></div>
        </div>
        
        <!-- فلاتر الفهرس -->
        <div class="mobile-index-filters">
            <label><input type="checkbox" id="mobileFilterSura" checked> السور</label>
            <label><input type="checkbox" id="mobileFilterJuza"> الأجزاء</label>
            <label><input type="checkbox" id="mobileFilterHizb"> الأحزاب</label>
        </div>
        
        <!-- قائمة الفهرس -->
        <div id="mobileIndexList" class="mobile-index-list"></div>
    </div>
</div>

    <button id="openRightMenuBtn" class="menu-open-btn right-open">📚</button>
    <button id="openLeftMenuBtn" class="menu-open-btn left-open">≡</button>
    <script src="script.js"></script>
</body>
</html>
