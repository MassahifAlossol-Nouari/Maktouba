<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ المصاحف - استمع إلى التلاوات</title>
    <link rel="stylesheet" href="Reader.css">
</head>
<body>
    <div class="app">
        <!-- الشريط العلوي -->
        <header class="top-bar">
            <div class="top-bar">
            <div class="selectors">
                <select id="mushafSelect" class="mushaf-dropdown"></select>
                <select id="reciterSelect" class="reciter-dropdown"></select>
            </div>
            <button id="backBtn" class="back-btn" onclick="window.location.href='../index.html'">🏠 الرئيسية</button>
    </div>
        </header>

        <!-- شريط الصوت -->
        <div class="audio-bar">
            <div class="audio-controls">
                <button id="playBtn" class="audio-btn">▶️</button>
                <button id="stopBtn" class="audio-btn">⏹️</button>
                <span id="currentTime" class="time">00:00</span>
                <input type="range" id="progressBar" class="progress-bar" value="0" step="1">
                <span id="duration" class="time">00:00</span>
                <button id="volumeBtn" class="audio-btn">🔊</button>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
            </div>
        </div>

        <!-- قائمة السور (مربعات صغيرة) -->
        <div class="surah-grid" id="surahGrid"></div>

        <!-- رسالة الحالة -->
        <div class="status" id="status">📖 اختر مصحفاً وسورة للاستماع</div>
    </div>

    <script src="Reader.js"></script>
</body>
</html>
