<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصاءات الكلمات الملونة - القراءات العشر</title>
    <link rel="stylesheet" href="stats.css">
</head>
<body>
    <div class="stats-app">
        <!-- رأس الصفحة -->
        <header class="stats-header">
            <h1>📊 إحصاءات الكلمات الملونة</h1>
            <button id="backToHomeBtn" class="back-btn" onclick="window.location.href='../index.html'">🏠 العودة إلى المصحف</button>
        </header>

        <!-- شريط التحكم -->
        <div class="stats-controls">
            <div class="filters">
                <select id="rawiSelect" class="stats-select">
                    <optgroup label="▶ نافع المدني">
                        <option value="mushaf_qalun1.js">قالون (قصر/إسكان)</option>
                        <option value="mushaf_qalun2.js">قالون (قصر/صلة)</option>
                        <option value="mushaf_qalun3.js">قالون (توسط/إسكان)</option>
                        <option value="mushaf_qalun4.js">قالون (توسط/صلة)</option>
                        <option value="mushaf_warsh1.js">ورش (قصر البدل/فتح)</option>
                        <option value="mushaf_warsh2.js">ورش (توسط البدل/تقليل)</option>
                        <option value="mushaf_warsh3.js">ورش (إشباع البدل/الفتح)</option>
                        <option value="mushaf_warsh4.js">ورش (إشباع البدل/تقليل)</option>
                        <option value="mushaf_warsh5.js">ورش (طريق الأصبهاني)</option>
                    </optgroup>
                    <optgroup label="▶ ابن كثير المكي">
                        <option value="mushaf_bazzi.js">البزي</option>
                        <option value="mushaf_qunbul.js">قنبل</option>
                    </optgroup>
                    <optgroup label="▶ أبو عمرو البصري">
                        <option value="mushaf_doori.js">الدوري</option>
                        <option value="mushaf_soosi.js">السوسي</option>
                    </optgroup>
                    <optgroup label="▶ ابن عامر الشامي">
                        <option value="mushaf_hisham.js">هشام</option>
                        <option value="mushaf_ibnDhakwan.js">ابن ذكوان</option>
                    </optgroup>
                    <optgroup label="▶ عاصم الكوفي">
                        <option value="mushaf_hafs.js" selected>حفص</option>
                        <option value="mushaf_shubah.js">شعبة</option>
                    </optgroup>
                    <optgroup label="▶ حمزة الكوفي">
                        <option value="mushaf_khalaf.js">خلف</option>
                        <option value="mushaf_khallad.js">خلاد</option>
                    </optgroup>
                    <optgroup label="▶ الكسائي الكوفي">
                        <option value="mushaf_abuHarith.js">أبو الحارث</option>
                        <option value="mushaf_doori_kisai.js">الدوري</option>
                    </optgroup>
                    <optgroup label="▶ أبو جعفر المدني">
                        <option value="mushaf_ibnWardan.js">ابن وردان</option>
                        <option value="mushaf_ibnJammaz.js">ابن جماز</option>
                    </optgroup>
                    <optgroup label="▶ يعقوب الحضرمي">
                        <option value="mushaf_ruways.js">رويس</option>
                        <option value="mushaf_ruh.js">روح</option>
                    </optgroup>
                    <optgroup label="▶ خلف العاشر">
                        <option value="mushaf_ishaq.js">إسحاق</option>
                        <option value="mushaf_idris.js">إدريس</option>
                    </optgroup>
                </select>
                
                <select id="colorFilterSelect" class="stats-select">
                    <option value="all">🎨 جميع الألوان</option>
                    <option value="c1" style="color:#FF0000;">🔴 الكلمات الفرشية (c1)</option>
                    <option value="c2" style="color:#753701;">🟤 عد الآيات (c2)</option>
                    <option value="c4" style="color:#ffbb00;">🟡 الإمالة والتقليل (c4)</option>
                    <option value="c5" style="color:#86cbec;">🔵 البسملة (c5)</option>
                    <option value="c6" style="color:#062264;">🔵 علامات الوقف (c6)</option>
                    <option value="c7" style="color:#0B9DF4;">🔵 الهمز المفرد (c7)</option>
                    <option value="c8" style="color:#25FB13;">🟢 اللامات لورش (c8)</option>
                    <option value="c9" style="color:#0004FF;">🔵 النقل والسكت (c9)</option>
                    <option value="c10" style="color:#06EED8;">🔵 مد البدل (c10)</option>
                    <option value="c11" style="color:#F98F1F;">🟠 الراءات لورش (c11)</option>
                    <option value="c12" style="color:#EE1E80;">🌸 ميم الجمع (c12)</option>
                    <option value="c13" style="color:#CD12E7;">🟣 مد اللين (c13)</option>
                    <option value="c14" style="color:#880D0D;">🔴 الياءات المتطرفة (c14)</option>
                    <option value="c15" style="color:#1255D6;">🔵 الإدغام (c15)</option>
                    <option value="c17" style="color:#602DBA;">🟣 الانفرادات (c17)</option>
                </select>
                
                <button id="analyzeBtn" class="stats-btn primary">🔍 تحليل</button>
                <button id="exportCsvBtn" class="stats-btn green">📎 تصدير CSV</button>
            </div>
            
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-bar" id="progressBar"></div>
                <span id="progressText">جاري التحليل...</span>
            </div>
        </div>

        <!-- الإحصائيات السريعة -->
        <div class="stats-summary" id="statsSummary">
            <div class="summary-card">
                <span class="summary-icon">📊</span>
                <span class="summary-label">إجمالي الكلمات</span>
                <span class="summary-value" id="totalWords">0</span>
            </div>
            <div class="summary-card">
                <span class="summary-icon" style="color:#FF0000;">🔴</span>
                <span class="summary-label">الفرشية</span>
                <span class="summary-value" id="totalC1">0</span>
            </div>
            <div class="summary-card">
                <span class="summary-icon" style="color:#ffbb00;">🟡</span>
                <span class="summary-label">الإمالة</span>
                <span class="summary-value" id="totalC4">0</span>
            </div>
            <div class="summary-card">
                <span class="summary-icon" style="color:#25FB13;">🟢</span>
                <span class="summary-label">اللامات</span>
                <span class="summary-value" id="totalC8">0</span>
            </div>
            <div class="summary-card">
                <span class="summary-icon" style="color:#F98F1F;">🟠</span>
                <span class="summary-label">الراءات</span>
                <span class="summary-value" id="totalC11">0</span>
            </div>
            <div class="summary-card">
                <span class="summary-icon" style="color:#EE1E80;">🌸</span>
                <span class="summary-label">ميم الجمع</span>
                <span class="summary-value" id="totalC12">0</span>
            </div>
            <div class="summary-card">
                <span class="summary-icon" style="color:#CD12E7;">🟣</span>
                <span class="summary-label">مد اللين</span>
                <span class="summary-value" id="totalC13">0</span>
            </div>
        </div>

        <!-- الجدول -->
        <div class="stats-table-container">
            <table id="statsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>السورة</th>
                        <th>رقم الآية</th>
                        <th>الصفحة</th>
                        <th>الكلمة</th>
                        <th>الحرف الملون</th>
                        <th>عدد الحروف</th>
                        <th>اللون</th>
                    </tr>
                </thead>
                <tbody id="statsTableBody">
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 60px;">
                            <div class="spinner"></div>
                            <p>اختر راوي ثم اضغط "تحليل"</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="stats.js"></script>
</body>
</html>
